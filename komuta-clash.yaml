# Komuta 免费节点 — Clash 配置
# 服务器：Komuta de-east（德国），免费 dz-nano
# 出口：美国（Fastly, AS394192），机房 IP
# 部署：2026-11-23；域名 komuta-xray-3a251828.edge-1.komuta.app
# 注意：免费档每月 450 awake 小时，闲置 30 分钟会睡，首次连接约等 1 分钟唤醒

port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxies:
  - name: "🇩🇪德国•Komuta01"
    type: vless
    server: komuta-xray-3a251828.edge-1.komuta.app
    port: 443
    uuid: 531778dd-ce1f-4fbc-a85b-101fe836160d
    tls: true
    servername: komuta-xray-3a251828.edge-1.komuta.app
    network: ws
    ws-opts:
      path: /vless

proxy-groups:
  - name: "Komuta"
    type: select
    proxies:
      - "🇩🇪德国•Komuta01"

rules:
  - GEOIP,CN,DIRECT
  - MATCH,Komuta
